name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atria
          POSTGRES_USER: atria
          POSTGRES_PASSWORD: atria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atria -d atria"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atria:atria@localhost:5432/atria?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      COOKIE_DOMAIN: localhost
      SECURE_COOKIES: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run db:generate
      - run: npm run build
      - run: npm run lint
